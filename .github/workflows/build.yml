name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew || true

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    - تا بره پشت صحنه، سرور روشن کنه، کدها رو کامپایل کنه و فایل نهایی `.apk` رو هلو برو تو گلو تحویلت بده! 🚀

کافیه این چند مرحله کوتاه رو انجام بدی:

---

### ⚙️ مرحله فعال‌سازی ساخت خودکار APK

1. **ساخت فایل تنظیمات ربات:**
   * دوباره روی همون **سه نقطه (...)** یا دکمه **Add file** بزن و گزینه **Create new file (ایجاد فایل جدید)** رو انتخاب کن.

2. **تعیین مسیر و نام فایل:**
   * در کادر نام فایل (Name your file)، دقیقاً این عبارت رو بنویس (یا کپی کن):
```text
.github/workflows/build.yml

name: Build Android APK

on:
  push:
branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
runs-on: ubuntu-latest

steps:
- name: Checkout Code
uses: actions/checkout@v4

- name: Set up JDK 17
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'temurin'

- name: Grant Execute Permission to Gradlew
run: chmod +x gradlew || true

- name: Build APK with Gradle
run: ./gradlew assembleDebug

- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: LockTimer-Debug-APK
path: app/build/outputs/apk/debug/*.apk
